## AquaDX for iStoreOS / OpenWrt

aimedb.server.enable=true
aimedb.server.address=0.0.0.0
aimedb.server.port=22345

billing.server.enable=true
billing.server.port=8443

# Port 80 belongs to LuCI, so AquaDX uses 8088 on the router.
allnet.server.port=8088
allnet.server.hide-port=false
allnet.server.place-name=AquaDX iStoreOS
allnet.server.check-keychip=false
allnet.server.keychip-ses-clean-interval=86400000
allnet.server.keychip-ses-expire=172800000
allnet.server.redirect=/index.html

server.address=0.0.0.0
server.port=8088

aquaviewer.server.enable=false
aquaviewer.api.enable=false

spring.web.resources.static-locations=file:/app/web/,classpath:/META-INF/resources/,classpath:/resources/,classpath:/static/,classpath:/public/

spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.username=aqua
spring.datasource.password=AquaDX_Local_DB_2026!
spring.datasource.url=jdbc:mariadb://127.0.0.1:3369/main?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.hikari.maximum-pool-size=10

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

paths.mai2-plays=/app/data/upload/mai2/plays
paths.mai2-portrait=/app/data/upload/mai2/portrait
paths.aqua-net-portrait=/app/data/upload/net/portrait

aqua-net.link-card-limit=10
aqua-net.keychip-limit=20
aqua-net.turnstile.enable=false
aqua-net.turnstile.secret=
aqua-net.email.enable=false
aqua-net.email.senderName=AquaDX
aqua-net.email.senderAddr=local@localhost
aqua-net.email.webHost=localhost
aqua-net.geoip.path=/app/data/GeoLite2-Country.mmdb
aqua-net.geoip.ip-header=X-Forwarded-For
aqua-net.jwt.secret=AquaDX-iStoreOS-Local-JWT-Change-This-2026
aqua-net.frontier.enabled=false
aqua-net.fedy.enabled=false
aqua-net.bot.enabled=false
aqua-net.openai.api-key=

server.error.whitelabel.enabled=false
management.server.port=18081
management.server.address=127.0.0.1
